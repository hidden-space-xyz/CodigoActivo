name: codigoactivo

services:
  api:
    image: codigoactivo-api-dev
    build:
      context: ./backend
      dockerfile: src/CodigoActivo.API/Dockerfile
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      LOG_DIRECTORY: ""
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURITY: None
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_FROM_ADDRESS: no-reply@codigoactivo.local
      SMTP_FROM_NAME: Código Activo (desarrollo)
    ports:
      - "5150:8080"
    read_only: false
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    depends_on:
      mailpit:
        condition: service_started

  web:
    image: codigoactivo-web-dev
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_started

  db:
    ports:
      - "5432:5432"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    networks: [backend]
    logging:
      driver: none

networks:
  backend:
    internal: false
