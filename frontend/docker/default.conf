map $http_x_forwarded_proto $codigoactivo_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $codigoactivo_forwarded_proto $codigoactivo_hsts {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

limit_req_zone $binary_remote_addr zone=codigoactivo_api:10m  rate=200r/s;
limit_req_zone $binary_remote_addr zone=codigoactivo_auth:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=codigoactivo_per_ip:10m;
limit_conn_zone $server_name zone=codigoactivo_server:1m;
limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;
limit_conn_log_level warn;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    resolver 127.0.0.11 valid=300s;
    resolver_timeout 5s;

    root  /usr/share/nginx/html;
    index index.html;

    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    absolute_redirect off;
    port_in_redirect  off;

    client_max_body_size  12m;
    client_body_timeout   15s;
    client_header_timeout 15s;
    send_timeout          30s;
    limit_conn codigoactivo_per_ip 2000;
    limit_conn codigoactivo_server 4000;

    include /etc/nginx/snippets/security-headers.conf;

    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css application/javascript text/javascript application/json application/xml image/svg+xml application/manifest+json;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location @rate_limited {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/json;
        add_header Retry-After "1" always;
        return 429 '{"title":"Too Many Requests","status":429}';
    }

    error_page 429 = @rate_limited;

    location = /sitemap.xml {
        limit_req zone=codigoactivo_api burst=500 delay=200;
        include /etc/nginx/snippets/proxy-api.conf;
        rewrite ^ /api/sitemap.xml break;
    }

    location = /robots.txt {
        limit_req zone=codigoactivo_api burst=500 delay=200;
        include /etc/nginx/snippets/proxy-api.conf;
        rewrite ^ /api/robots.txt break;
    }

    location ~* ^/api/auth/(login|register|forgot-password|[^/]+/(verify|resend-verification|reset-password))/?$ {
        limit_req zone=codigoactivo_auth burst=100 nodelay;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    location ~* ^/api/users/[^/]+/password/?$ {
        limit_req zone=codigoactivo_auth burst=100 nodelay;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    location /api/ {
        limit_req zone=codigoactivo_api burst=500 delay=200;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;

        location ~ /\. {
            return 404;
        }
    }

    # Public files keep stable names, so use a short TTL instead of immutable caching.
    location ~* ^/(favicon\.ico|favicon-96x96\.png|apple-touch-icon\.png|og-image\.png)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;

        location ~ /\. {
            return 404;
        }
    }
}
