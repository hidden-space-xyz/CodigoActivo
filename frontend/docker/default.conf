map $http_x_forwarded_proto $codigoactivo_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $codigoactivo_forwarded_proto $codigoactivo_hsts {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

limit_req_zone $binary_remote_addr zone=codigoactivo_api:10m  rate=30r/s;
limit_req_zone $binary_remote_addr zone=codigoactivo_auth:10m rate=30r/m;
limit_req_status 429;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    resolver 127.0.0.11 valid=300s;
    resolver_timeout 5s;

    root  /usr/share/nginx/html;
    index index.html;

    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    absolute_redirect off;
    port_in_redirect  off;

    client_max_body_size  12m;
    client_body_timeout   15s;
    client_header_timeout 15s;
    send_timeout          30s;

    include /etc/nginx/snippets/security-headers.conf;

    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css application/javascript text/javascript application/json application/xml image/svg+xml application/manifest+json;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /sitemap.xml {
        limit_req zone=codigoactivo_api burst=100 nodelay;
        include /etc/nginx/snippets/proxy-api.conf;
        rewrite ^ /api/sitemap.xml break;
    }

    location = /robots.txt {
        limit_req zone=codigoactivo_api burst=100 nodelay;
        include /etc/nginx/snippets/proxy-api.conf;
        rewrite ^ /api/robots.txt break;
    }

    location ~* ^/api/auth/(login|register|forgot-password|[^/]+/(verify|resend-verification|reset-password)) {
        limit_req zone=codigoactivo_auth burst=15 nodelay;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    location /api/ {
        limit_req zone=codigoactivo_api burst=100 nodelay;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;

        location ~ /\. {
            return 404;
        }
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;

        location ~ /\. {
            return 404;
        }
    }
}
