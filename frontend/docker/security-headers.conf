add_header X-Content-Type-Options             nosniff always;
add_header X-Frame-Options                    DENY always;
add_header Referrer-Policy                    same-origin always;
add_header X-Permitted-Cross-Domain-Policies  none always;
add_header X-DNS-Prefetch-Control             off always;
add_header Permissions-Policy                 "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), serial=(), usb=()" always;
add_header Cross-Origin-Opener-Policy         same-origin always;
add_header Cross-Origin-Resource-Policy       same-origin always;

add_header Strict-Transport-Security $codigoactivo_hsts always;

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-src 'none'; worker-src 'none'; media-src 'none'; manifest-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'${codigoactivo_csp_upgrade}" always;
