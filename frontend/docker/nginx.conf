worker_processes auto;
worker_rlimit_nofile 65536;
# Error-level entries (rate limiting, upstream failures) repeat the full request line, query string and
# Referer, so only critical conditions are logged; the access log records those outcomes without them.
error_log /dev/stderr crit;
pid /tmp/nginx.pid;
include /etc/nginx/modules/*.conf;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Data minimisation: log the path without its query string and without the Referer, which can
    # carry search filters with personal data. Timing, upstream and rate-limit fields keep diagnostics.
    # The path comes from $request_uri because $uri follows internal redirects such as the SPA fallback.
    map $request_uri $request_path {
        ~^([^?]*) $1;
    }

    log_format main '$remote_addr [$time_local] "$request_method $request_path $server_protocol" '
                    '$status $body_bytes_sent rt=$request_time '
                    'upstream=$upstream_status urt=$upstream_response_time '
                    'limit=$limit_req_status "$http_user_agent"';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    keepalive_requests 1000;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include /etc/nginx/conf.d/*.conf;
}
