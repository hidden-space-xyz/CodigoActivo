name: codigoactivo

x-logging: &logging
  driver: none

x-database: &database
  POSTGRES_DB: codigoactivo
  POSTGRES_USER: codigoactivo

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "log_error_verbosity=terse"]
    environment:
      <<: *database
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - db-data:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    logging: *logging

  api:
    image: ghcr.io/hidden-space-xyz/codigoactivo-backend:latest
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *database
      POSTGRES_HOST: db
      APP_BASE_URL: ${APP_BASE_URL}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Madrid}
      DEMO_MODE: ${DEMO_MODE}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
    secrets: [postgres_password, data_protection_certificate_password, smtp_password]
    volumes:
      - api-files:/app/files
      - api-dataprotection:/home/app/.aspnet/DataProtection-Keys
      - api-state:/app/state
      - logs-api:/var/log/codigoactivo
    networks: [backend, frontend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging

  web:
    image: ghcr.io/hidden-space-xyz/codigoactivo-frontend:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "0.0.0.0:8080:8080"
    networks: [frontend]
    read_only: true
    tmpfs: [/tmp]
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging

networks:
  frontend:
    driver: bridge
    enable_ipv6: false
  backend:
    driver: bridge
    enable_ipv6: false
    internal: true

volumes:
  db-data:
  api-files:
  api-dataprotection:
  api-state:
  logs-api:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  data_protection_certificate_password:
    file: ./secrets/data_protection_certificate_password
  smtp_password:
    file: ./secrets/smtp_password
