name: CI

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  codeql:
    needs: [backend, frontend]
    uses: ./.github/workflows/codeql.yml
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

  release:
    needs: codeql
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: write
      packages: write

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies and tools
        run: |
          dotnet restore CodigoActivo.slnx
          dotnet tool restore
      - name: Build backend
        run: dotnet build CodigoActivo.slnx --configuration Release --no-restore
      - name: Unit tests with coverage
        run: >-
          dotnet test tests/CodigoActivo.UnitTests/CodigoActivo.UnitTests.csproj
          --configuration Release --no-build --no-restore
          --coverage --coverage-output-format cobertura --coverage-output unit.cobertura.xml
          --coverage-settings tests/CodeCoverage.config --results-directory TestResults/coverage
      - name: Integration tests with coverage
        run: >-
          dotnet test tests/CodigoActivo.IntegrationTests/CodigoActivo.IntegrationTests.csproj
          --configuration Release --no-build --no-restore
          --coverage --coverage-output-format cobertura --coverage-output integration.cobertura.xml
          --coverage-settings tests/CodeCoverage.config --results-directory TestResults/coverage
      - name: Report and enforce coverage >= 90%
        run: |
          dotnet reportgenerator "-reports:TestResults/coverage/*.cobertura.xml" -targetdir:TestResults/coverage/report "-reporttypes:JsonSummary;MarkdownSummaryGithub"
          cat TestResults/coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          dotnet run --file scripts/check-coverage.cs -- TestResults/coverage/report/Summary.json 90

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and audit dependencies
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high
      - name: Verify API client and build frontend
        run: |
          npm run api:check
          npm run build
      - name: Tests and coverage >= 90%
        run: npm run test:coverage
      - name: Code quality and formatting
        run: |
          npm run lint
          npm run lint:fsd
          npm run lint:styles
          npm run lint:unused
          npm run format:check
