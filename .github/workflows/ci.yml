name: CI

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  codeql:
    needs: [backend, frontend, pipeline-tests]
    uses: ./.github/workflows/codeql.yml
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

  release:
    needs: codeql
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: write
      packages: write

  pipeline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: node --test .github/scripts/*.test.mjs

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore CodigoActivo.slnx
      - run: dotnet tool restore
      - run: dotnet build CodigoActivo.slnx --configuration Release --no-restore
      - run: dotnet test tests/CodigoActivo.UnitTests/CodigoActivo.UnitTests.csproj --configuration Release --no-build --no-restore --coverage --coverage-output-format cobertura --coverage-output unit.cobertura.xml --coverage-settings tests/CodeCoverage.config --results-directory TestResults/coverage
      - run: dotnet test tests/CodigoActivo.IntegrationTests/CodigoActivo.IntegrationTests.csproj --configuration Release --no-build --no-restore --coverage --coverage-output-format cobertura --coverage-output integration.cobertura.xml --coverage-settings tests/CodeCoverage.config --results-directory TestResults/coverage
      - run: dotnet reportgenerator "-reports:TestResults/coverage/*.cobertura.xml" -targetdir:TestResults/coverage/report "-reporttypes:JsonSummary;MarkdownSummaryGithub"
      - run: cat TestResults/coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - run: dotnet run --file scripts/check-coverage.cs -- TestResults/coverage/report/Summary.json 90

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm run check
