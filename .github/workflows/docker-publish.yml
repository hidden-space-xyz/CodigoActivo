name: Docker Publish

on:
  push:
    branches: [ "master" ]

concurrency:
  group: ${{ github.workflow }}

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            image: backend
            context: backend
            dockerfile: backend/src/CodigoActivo.API/Dockerfile
            version-command: sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' backend/src/CodigoActivo.API/CodigoActivo.API.csproj
          - name: UI
            image: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            version-command: jq -r .version frontend/package.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve version
        id: meta
        run: |
          version="$(${{ matrix.version-command }})"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid ${{ matrix.name }} version '$version' (expected X.X.X)"
            exit 1
          fi
          tag="v${version}-${{ matrix.name }}"
          if git ls-remote --exit-code origin "refs/tags/${tag}" > /dev/null; then
            echo "${tag} already released, skipping publish"
            changed=false
          else
            changed=true
          fi
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "changed=${changed}"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.image }}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.meta.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: steps.meta.outputs.changed == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.meta.outputs.changed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Push release tag
        if: steps.meta.outputs.changed == 'true'
        run: |
          git tag "${{ steps.meta.outputs.tag }}"
          git push origin "${{ steps.meta.outputs.tag }}"
