name: Docker Publish

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [ "master" ]

concurrency:
  group: ${{ github.workflow }}

permissions:
  contents: write
  packages: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            image: backend
            context: backend
            dockerfile: backend/src/CodigoActivo.API/Dockerfile
            version-command: sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' backend/src/CodigoActivo.API/CodigoActivo.API.csproj
          - name: UI
            image: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            version-command: jq -r .version frontend/package.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve version
        id: meta
        run: |
          version="$(${{ matrix.version-command }})"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid ${{ matrix.name }} version '$version' (expected X.X.X)"
            exit 1
          fi
          tag="v${version}-${{ matrix.name }}"
          if git ls-remote --exit-code origin "refs/tags/${tag}" > /dev/null; then
            echo "${tag} already released, skipping publish"
            changed=false
          else
            changed=true
          fi
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "changed=${changed}"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.image }}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.meta.outputs.changed == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build image for security scan
        if: steps.meta.outputs.changed == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: codigoactivo-audit-${{ matrix.image }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Scan image for high and critical vulnerabilities
        if: steps.meta.outputs.changed == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: codigoactivo-audit-${{ matrix.image }}:${{ github.event.workflow_run.head_sha }}
          version: v0.74.0
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          scanners: vuln

      - name: Log in to GitHub Container Registry
        if: steps.meta.outputs.changed == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push verified image
        if: steps.meta.outputs.changed == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}

      - name: Push release tag
        if: steps.meta.outputs.changed == 'true'
        run: |
          git tag "${{ steps.meta.outputs.tag }}"
          git push origin "${{ steps.meta.outputs.tag }}"
